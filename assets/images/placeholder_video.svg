<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="videoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="videoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0b0f19" rx="16"/>
  <rect width="800" height="450" fill="url(#videoGlow)" rx="16"/>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="url(#videoBorder)" stroke-width="2" rx="14"/>

  <!-- Big Play Button -->
  <circle cx="400" cy="180" r="55" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="388,155 424,180 388,205" fill="#38bdf8"/>

  <!-- Labels -->
  <text x="400" y="275" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">
    [Placeholder: Video Demonstration]
  </text>
  <text x="400" y="310" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">
    Upload your MP4 / video demonstration file
  </text>
  <text x="400" y="345" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    Target: assets/videos/
  </text>
</svg>
